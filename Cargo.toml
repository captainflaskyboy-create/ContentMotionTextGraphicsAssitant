[package]
name = "ContentMotionTextGraphicsAssitant"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Captain Flasky Boy"]
description = "Native Windows motion graphics renderer for explicit JSON scenes"
license = "MIT"
repository = "https://github.com/captainflaskyboy-create/ContentMotionTextGraphicsAssitant"

[[bin]]
name = "cmtga"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
ctrlc = "3"
tempfile = "3"
unicode-segmentation = "1"
windows-numerics = "0.3"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
